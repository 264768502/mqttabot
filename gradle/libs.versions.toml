[versions]
agp = "9.5.0"
# Overrides the Kotlin version bundled with AGP's built-in Kotlin support.
kotlin = "2.4.21"
appcompat = "1.8.0"
material = "1.14.0"
coreKtx = "1.19.1"
paho = "1.2.5"
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.3.0"
mockk = "1.14.11"
moquette = "0.17"
jacoco = "0.8.16"
spotless = "8.10.4"
ktlint = "1.8.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
material = { module = "com.google.android.material:material", version.ref = "material" }
paho-mqttv3 = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version.ref = "paho" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestJunit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
moquette = { module = "io.moquette:moquette-broker", version.ref = "moquette" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
