name: Release

# Publish a release either by pushing a tag (git tag v1.2.0 && git push origin v1.2.0)
# or by running this workflow manually with a version, which creates the tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 1.2.0 or 1.3.0-beta.1"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$version'; expected 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          {
            echo "version=$version"
            echo "code=$code"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          sed -i -E "s/^( *versionCode = )[0-9]+/\1$CODE/; s/^( *versionName = )\"[^\"]*\"/\1\"$VERSION\"/" app/build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release $TAG"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Check version in source matches the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          name=$(sed -nE 's/^ *versionName = "([^"]*)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ "$name" != "$VERSION" ] || [ "$code" != "$CODE" ]; then
            echo "::error::app/build.gradle.kts has versionName=$name versionCode=$code; tag needs versionName=$VERSION versionCode=$CODE. Bump them before tagging, or use the manual Release workflow."
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PRERELEASE" != "true" ]; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is not set; refusing to publish a final release signed with a debug key."
              exit 1
            fi
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set; the release APK is signed with a debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify and build APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck :app:check :app:assembleDebug :app:assembleRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/mqttabot-$VERSION-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/mqttabot-$VERSION-debug.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          notes="dist/NOTES.md"
          {
            echo "- \`mqttabot-$VERSION-release.apk\`: release build"
            echo "- \`mqttabot-$VERSION-debug.apk\`: debug build"
            echo "- \`SHA256SUMS.txt\`: checksums"
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> **Note:** this release APK is signed with a debug key, not a release key."
            fi
          } > "$notes"
          args=(--title "MqttABot $VERSION" --notes-file "$notes" --generate-notes --verify-tag)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*.apk dist/SHA256SUMS.txt
